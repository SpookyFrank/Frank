
name: Daily Science Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: read

jobs:
  create-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Generate Science Short
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED || '0' }}
        run: python main.py

      - name: Save generated video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: science-short
          path: output/
          if-no-files-found: warn
          retention-days: 7
